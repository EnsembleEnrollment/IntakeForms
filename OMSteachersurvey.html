<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; connect-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="description" content="This teacher form is no longer in use. Open the current Teacher Information Survey.">
  <meta name="robots" content="noindex, follow">
  <title>Teacher Form Has Moved — Enrollment Hub</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      --bg: #F3F4F6;
      --card: #FFFFFF;
      --border: #E7E9ED;
      --text: #1F2937;
      --strong: #111827;
      --muted: #6B7280;
      --ac: #C9961A;
      --ac-dk: #A87B0F;
      --shadow: 0 1px 2px rgba(17,24,39,.04), 0 4px 18px rgba(17,24,39,.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .page { max-width: 780px; margin: 0 auto; padding: 24px 20px 80px; }
    .mast { text-align: center; padding: 14px 0 22px; }
    .mast p { color: var(--strong); font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
    .card {
      padding: 32px 26px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }
    h1 { color: var(--strong); font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
    .message { margin-top: 10px; max-width: 56ch; color: var(--muted); }
    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 48px;
      margin-top: 24px;
      padding: 12px 20px;
      border: 1px solid var(--ac);
      border-radius: 12px;
      background: var(--ac);
      color: var(--strong);
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
    }
    .button:hover { background: var(--ac-dk); border-color: var(--ac-dk); }
    .button:focus-visible { outline: 3px solid var(--strong); outline-offset: 4px; }
    .help { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }
    @media (max-width: 480px) {
      .page { padding: 20px 16px 48px; }
      .mast p { font-size: 23px; }
      .card { padding: 26px 20px; }
      h1 { font-size: 22px; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="mast">
      <p>Teacher Information Survey</p>
    </header>
    <section class="card" aria-labelledby="moved-heading">
      <h1 id="moved-heading">This form has moved</h1>
      <p class="message">This form is no longer in use. Please use the current teacher form linked below.</p>
      <a class="button" href="https://ensembleenrollment.github.io/IntakeForms/teachersurvey.html">Open current teacher form</a>
      <p class="help">Contact your studio director with any questions.</p>
    </section>
  </main>
</body>
</html>
